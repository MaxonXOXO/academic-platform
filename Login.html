  <script>
    let activeRole = "student";
    let base64Photo = "";

    function toggleRoleTab(role) {
      activeRole = role;
      const tabStudent = document.getElementById('tabStudent');
      const tabStaff = document.getElementById('tabStaff');
      const sFields = document.getElementById('studentLoginFields');
      const fFields = document.getElementById('staffLoginFields');

      if (role === 'student') {
        tabStudent.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-blue-600 bg-white shadow-sm transition-premium flex items-center justify-center gap-1.5";
        tabStaff.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:text-slate-800 transition-premium flex items-center justify-center gap-1.5";
        sFields.classList.remove('hidden');
        fFields.classList.add('hidden');
      } else {
        tabStaff.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-blue-600 bg-white shadow-sm transition-premium flex items-center justify-center gap-1.5";
        tabStudent.className = "flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:text-slate-800 transition-premium flex items-center justify-center gap-1.5";
        fFields.classList.remove('hidden');
        sFields.classList.add('hidden');
      }
    }

    function showRegister(type) {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('registerSection').classList.remove('hidden');
      const rTitle = document.getElementById('registerTitle');
      const regS = document.getElementById('regStudentFields');
      const regF = document.getElementById('regStaffFields');
      const regAlert = document.getElementById('regAlert');

      // Reset form fields and alerts
      const form = document.getElementById('registerForm');
      if (form) form.reset();
      if (regAlert) regAlert.classList.add('hidden');

      base64Photo = "";
      document.getElementById('photoPreviewContainer').classList.add('hidden');
      document.getElementById('photoPreview').src = "";
      document.getElementById('regPhoto').value = "";

      if (type === 'student') {
        activeRole = "student";
        rTitle.innerText = "Register Student Profile";
        regS.classList.remove('hidden');
        regF.classList.add('hidden');
      } else {
        activeRole = "staff";
        rTitle.innerText = "Register Academic Staff";
        regF.classList.remove('hidden');
        regS.classList.add('hidden');
      }
    }

    function showLogin() {
      document.getElementById('registerSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      toggleRoleTab(activeRole);
    }

    function convertPhotoToBase64() {
      const fileInput = document.getElementById('regPhoto');
      const preview = document.getElementById('photoPreview');
      const container = document.getElementById('photoPreviewContainer');
      const regAlert = document.getElementById('regAlert');
      const spinner = document.getElementById('regSpinner');
      const btnText = document.getElementById('regBtnText');

      base64Photo = "";
      const file = fileInput ? fileInput.files[0] : null;
      if (!file) return;

      const validTypes = ['image/jpeg', 'image/png', 'image/jpg', 'image/webp'];
      if (!validTypes.includes(file.type.toLowerCase()) && !file.type.startsWith('image/')) {
        showRegError(regAlert, spinner, btnText, "Image type mismatch: Selected file is not a valid photo. Please select a JPG, PNG, or WebP image.");
        if (fileInput) fileInput.value = "";
        container.classList.add('hidden');
        preview.src = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        const image = new Image();
        image.onerror = function() {
          showRegError(regAlert, spinner, btnText, "Image format mismatch: File is damaged or not a valid image.");
          if (fileInput) fileInput.value = "";
          container.classList.add('hidden');
          preview.src = "";
        };

        image.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = image.width;
          let height = image.height;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(image, 0, 0, width, height);

          base64Photo = canvas.toDataURL('image/jpeg', 0.85);
          preview.src = base64Photo;
          container.classList.remove('hidden');
        };

        image.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleLogin(e) {
      e.preventDefault();

      const loginAlert = document.getElementById('loginAlert');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      loginAlert.classList.add('hidden');
      spinner.classList.remove('hidden');
      btnText.innerText = "Verifying...";

      try {
        let userId = "";
        let password = document.getElementById('loginPassword').value;

        if (activeRole === 'student') {
          userId = document.getElementById('loginUserId').value;
        } else {
          userId = document.getElementById('loginMobileId').value;
        }

        if (!userId || !password) {
          showError(loginAlert, spinner, btnText, "Please fill in all credentials.");
          return;
        }

        // Call Google Apps Script backend loginUser
        google.script.run
          .withSuccessHandler(function (response) {
            if (response.status === "SUCCESS") {
              // Save details to sessionStorage
              sessionStorage.setItem("userRole", response.role);
              sessionStorage.setItem("userId", response.id);
              sessionStorage.setItem("userName", response.name);
              sessionStorage.setItem("userBranch", response.branch || "Admin");
              sessionStorage.setItem("userPhoto", response.photo || "");

              // Redirect to appropriate dashboard by reloading the page with the parameter
              let route = "login";
              if (response.role === "Student") route = "student";
              else if (response.role === "HOD") route = "hod";
              else if (response.role === "Principal") route = "principal";
              else if (response.role === "Super_Admin" || response.role === "Academic_Coordinator") route = "admin";
              else {
                route = "faculty";
              }

              navigateToPage(route);
            } else {
              showError(loginAlert, spinner, btnText, response.message);
            }
          })
          .withFailureHandler(function (err) {
            showError(loginAlert, spinner, btnText, "Connection failed: " + (err.message || err));
          })
          .loginUser(userId, password, activeRole);
      } catch (err) {
        showError(loginAlert, spinner, btnText, "Client Error: " + err.message);
      }
    }

    function handleRegistration(e) {
      e.preventDefault();

      const regAlert = document.getElementById('regAlert');
      const spinner = document.getElementById('regSpinner');
      const btnText = document.getElementById('regBtnText');

      regAlert.classList.add('hidden');
      spinner.classList.remove('hidden');
      btnText.innerText = "Submitting...";

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;

      if (activeRole === 'student') {
        const regNo = document.getElementById('regStudentId').value;
        const admNo = document.getElementById('regStudentAdm').value;
        const branch = document.getElementById('regStudentBranch').value;
        const admissionYear = document.getElementById('regStudentYear').value;
        const semester = document.getElementById('regStudentSem').value;

        if (!regNo || !admNo || !name || !email || !password) {
          showRegError(regAlert, spinner, btnText, "Please fill in all required fields.");
          return;
        }

        const studentData = { regNo, admNo, name, email, password, branch, admissionYear, semester, photoUrl: base64Photo };

        google.script.run
          .withSuccessHandler(function (response) {
            if (response.status === "SUCCESS") {
              showRegSuccess(regAlert, spinner, btnText, response.message + " You can log in once approved.");
            } else {
              showRegError(regAlert, spinner, btnText, response.message);
            }
          })
          .withFailureHandler(function (err) {
            showRegError(regAlert, spinner, btnText, "Registration failed: " + err.message);
          })
          .registerStudent(studentData);
      } else {
        const mobileNo = document.getElementById('regStaffMobile').value;
        const branch = document.getElementById('regStaffBranch').value;
        const designation = document.getElementById('regStaffDesig').value;

        if (!mobileNo || !name || !email || !password) {
          showRegError(regAlert, spinner, btnText, "Please fill in all required fields.");
          return;
        }

        const staffData = { mobileNo, name, email, branch, designation, password, photoUrl: base64Photo };

        google.script.run
          .withSuccessHandler(function (response) {
            if (response.status === "SUCCESS") {
              showRegSuccess(regAlert, spinner, btnText, response.message);
            } else {
              showRegError(regAlert, spinner, btnText, response.message);
            }
          })
          .withFailureHandler(function (err) {
            showRegError(regAlert, spinner, btnText, "Registration failed: " + err.message);
          })
          .registerStaff(staffData);
      }
    }

    function showError(alertEl, spinner, btnText, msg) {
      alertEl.className = "p-4 rounded-xl text-sm font-semibold bg-red-100 text-red-700 border border-red-200 block";
      alertEl.innerText = msg;
      spinner.classList.add('hidden');
      btnText.innerText = "Access Portal";
    }

    function showRegError(alertEl, spinner, btnText, msg) {
      alertEl.className = "p-4 rounded-xl text-sm font-semibold bg-red-100 text-red-700 border border-red-200 block";
      alertEl.innerText = msg;
      spinner.classList.add('hidden');
      btnText.innerText = "Register";
    }

    function showRegSuccess(alertEl, spinner, btnText, msg) {
      alertEl.className = "p-4 rounded-xl text-sm font-semibold bg-green-100 text-green-700 border border-green-200 block";
      alertEl.innerText = msg;
      spinner.classList.add('hidden');
      btnText.innerText = "Register";
      setTimeout(function () {
        showLogin();
      }, 3000);
    }
  </script>
