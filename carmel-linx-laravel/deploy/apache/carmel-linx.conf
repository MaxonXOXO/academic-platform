<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/carmel-linx/public

    <Directory /var/www>
        Options FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/carmel-linx/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/carmel-error.log
    CustomLog ${APACHE_LOG_DIR}/carmel-access.log combined
</VirtualHost>
